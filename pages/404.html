<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>页面不存在（404） - 闪电下载</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />
  <link rel="canonical" href="{{SITE_URL}}/404" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    function __applyTailwindConfig(){if(!window.tailwind)return;tailwind.config={theme:{extend:{colors:{brand:{DEFAULT:'#1777ff',dark:'#1666e6',soft:'#eaf2ff'}},fontFamily:{sans:['Inter','system-ui','sans-serif']}}}};}
    if(window.tailwind)__applyTailwindConfig();else window.addEventListener('load',__applyTailwindConfig);
  </script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body class="bg-white text-slate-900 antialiased">
  <main class="min-h-[70vh] flex items-center justify-center px-4 py-20">
    <div class="text-center max-w-md">
      <div class="text-6xl font-black text-brand">404</div>
      <h1 class="mt-3 text-xl font-bold text-slate-900">页面走丢了</h1>
      <p class="mt-2 text-sm text-slate-500">你访问的页面不存在或已被移动。回到首页继续解析下载视频，或浏览实用教程。</p>
      <div class="mt-6 flex flex-wrap justify-center gap-3">
        <a href="/" class="rounded-xl bg-brand text-white font-semibold px-6 py-3 text-sm hover:bg-brand-dark transition">返回首页</a>
        <a href="/guides" class="rounded-xl border border-slate-200 text-slate-600 px-6 py-3 text-sm hover:bg-slate-50 transition">浏览下载教程</a>
      </div>
    </div>
  </main>
</body>
</html>
